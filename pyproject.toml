[project]
name = "apps-pressure-telemetry"
version = "0.1.0"
description = "Community project (not an official Databricks product): one-call OpenTelemetry pressure signals for FastAPI / MLflow AgentServer apps on Databricks Apps - container CPU/memory/disk vs real limits, request concurrency, event-loop lag, LLM-call latency, tokens and errors."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["opentelemetry", "databricks", "databricks-apps", "fastapi", "genai", "llm", "observability", "cgroup"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: FastAPI",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "opentelemetry-api>=1.30",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-grpc>=1.30",
]

[project.urls]
Homepage = "https://github.com/natefleming/apps-pressure-telemetry"
Repository = "https://github.com/natefleming/apps-pressure-telemetry"
Issues = "https://github.com/natefleming/apps-pressure-telemetry/issues"
Changelog = "https://github.com/natefleming/apps-pressure-telemetry/blob/main/CHANGELOG.md"

[project.optional-dependencies]
fastapi = ["opentelemetry-instrumentation-fastapi>=0.51b0"]
system = ["opentelemetry-instrumentation-system-metrics>=0.51b0"]
openai = ["openai>=1.66"]  # first release with the Responses API
# request spans for Flask / Dash apps (request metrics work without it)
flask = ["opentelemetry-instrumentation-flask>=0.51b0"]
all = ["apps-pressure-telemetry[fastapi,system,openai]"]

[dependency-groups]
dev = [
    "apps-pressure-telemetry[all]",
    "fastapi>=0.110",
    "flask>=3.0",
    "httpx>=0.27",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["databricks_apps_telemetry"]

[tool.hatch.build.targets.sdist]
include = ["databricks_apps_telemetry", "tests", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint.per-file-ignores]
# Databricks notebooks: spark / dbutils / display are runtime globals; cells are separated by comments
"examples/**/notebooks/*.py" = ["F821", "E402", "I001"]
